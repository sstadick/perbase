name: Publish

on:
  push:
    tags:
      - "*"

jobs:
  publish:
    name: Publish for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: perbase
            asset_name: perbase-linux-amd64
          - os: macos-latest
            artifact_name: perbase
            asset_name: perbase-macos-amd64
          # - os: windows-latest
          #   artifact_name: perbase.exe
          #   asset_name: perbase-windows-amd64

    steps:
      - uses: actions/checkout@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - name: Build
        run: cargo build --release --locked --features seqair
      - name: Check Seqair support
        run: |
          target/release/perbase base-depth --help | grep -- --seqair
          target/release/perbase only-depth --help | grep -- --seqair
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/release/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          tag: ${{ github.ref }}
